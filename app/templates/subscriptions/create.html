
{% extends "base.html" %}

{% block title %}New Subscription | Staxio{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Create Subscription</h1>
        <p>Start a customer subscription or prepare a quotation.</p>
    </div>
    <a href="{{ url_for('subscriptions.index') }}" class="btn btn-secondary">
        Back
    </a>
</div>

<form method="POST" class="form-card">
    <div class="form-grid">
        <div class="form-group">
            <label for="customer_id">Customer</label>
            <select id="customer_id" name="customer_id" required>
                <option value="">Select customer</option>
                {% for customer in customers %}
                <option value="{{ customer.id }}"
                    {% if request.form.get('customer_id') == customer.id|string %}selected{% endif %}>
                    {{ customer.name }} — {{ customer.email }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="plan_id">Plan</label>
            <select id="plan_id" name="plan_id" required>
                <option value="">Select plan</option>
                {% for plan in plans %}
                <option value="{{ plan.id }}"
                    {% if request.form.get('plan_id') == plan.id|string %}selected{% endif %}>
                    {{ plan.name }} — {{ plan.billing_frequency|capitalize }}
                    (minimum quantity: {{ plan.minimum_quantity }})
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="template_id">Quotation Template (optional)</label>
            <select id="template_id" name="template_id">
                <option value="">Use plan lines</option>
                {% for template in templates %}
                <option value="{{ template.id }}"
                    {% if request.form.get('template_id') == template.id|string %}selected{% endif %}>
                    {{ template.name }} — {{ template.validity_days }} days
                </option>
                {% endfor %}
            </select>
            <small>Choose a template to use its product lines instead of the plan's default lines.</small>
        </div>

        <div class="form-group">
            <label for="start_date">Start Date</label>
            <input
                id="start_date"
                type="date"
                name="start_date"
                value="{{ request.form.get('start_date', today) }}"
                required>
        </div>

        <div class="form-group">
            <label for="status">Initial Status</label>
            <select id="status" name="status" required>
                <option value="draft">Draft</option>
                <option value="quotation"
                    {% if request.form.get('status') == 'quotation' %}selected{% endif %}>
                    Quotation
                </option>
            </select>
        </div>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Create Subscription</button>
        <a href="{{ url_for('subscriptions.index') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
