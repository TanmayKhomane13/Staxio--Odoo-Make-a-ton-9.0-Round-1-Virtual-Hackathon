<header class="topbar">
    <div class="topbar-left">
        <button class="icon-button mobile-menu-button"
                type="button"
                aria-label="Toggle navigation"
                data-sidebar-toggle>
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="breadcrumb">
            <span>Workspace</span>
            <span class="breadcrumb-separator">/</span>
            <strong>{% block page_name %}Overview{% endblock %}</strong>
        </div>
    </div>

    <div class="topbar-right">
        <span class="topbar-company">{{ company_name }}</span>

        <div class="user-menu">
            <div class="user-avatar">
                {{ current_user.full_name[:1]|upper }}
            </div>

            <div class="user-details">
                <strong>{{ current_user.full_name }}</strong>
                <span>{{ current_user.role|title }}</span>
            </div>

            <form method="POST" action="{{ url_for('auth.logout') }}">
                <button class="text-button logout-button" type="submit">
                    Log out
                </button>
            </form>
        </div>
    </div>
</header>
